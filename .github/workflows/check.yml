name: check

on:
  pull_request:
    paths:
      - "datasets/**"
      - "compose/**"
      - "support/**"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.sql"
      - "**/Makefile"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.detect.outputs.dirs }}
      count: ${{ steps.detect.outputs.count }}
      found: ${{ steps.detect.outputs.found }}
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/detect-changed-datasets@main
        id: detect
        with:
          paths: "datasets compose"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-config:
    needs: detect
    if: needs.detect.outputs.found == 'true'
    uses: dataciviclab/.github/.github/workflows/dataset-config-check-reusable.yml@main
    with:
      configs: ${{ needs.detect.outputs.dirs }}
      years: "from-config"

  # Test del repo: gira sempre (non dipende da detect), cosi' anche le PR
  # dashboard-only hanno un segnale CI reale (le pagine si compilano, i contratti
  # mart sono verificati quando i parquet locali esistono, altrimenti skippano).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "dev"
      - name: pytest
        run: pytest tests/ dashboard/tests -q
