root: "../../out"
schema_version: 1

dataset:
  name: "terna_emissioni_co2"
  source_id: "terna_opendata"
  tags: [energia, emissioni, co2, combustibile, regioni]
  category: energia
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  time_coverage:
    start_year: 2015
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "terna_gross_vs_co2_emissions_xlsx"
      type: "http_file"
      args:
        url: "https://dati.terna.it/api/sitecore/dati/downloadcenter/records?f=xlsx&filterDataset=GrossVsCO2Emissions&filterYear={year}&filterMonth=12&orderByColumn=Anno&orderByDir=desc&db=dati&pageSize=500"
        filename: "terna_gross_vs_co2_emissions_{year}_12.xlsx"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    header: true
    sheet_name: "Export"
  required_columns: [anno, combustibile, produzione, regione, emissioni_mt]
  validate:
    min_rows: 50
    not_null: [anno, combustibile]

mart:
  tables:
    - name: "mart_emissioni_combustibile"
      sql: "sql/mart_emissioni_combustibile.sql"
    - name: "mart_emissioni_regione"
      sql: "sql/mart_emissioni_regione.sql"
  required_tables:
    - "mart_emissioni_combustibile"
    - "mart_emissioni_regione"
  validate:
    table_rules:
      mart_emissioni_combustibile:
        required_columns: [anno, combustibile, emissioni_mt, quota_pct]
        primary_key: [anno, combustibile]
        min_rows: 3
      mart_emissioni_regione:
        required_columns: [anno, regione, emissioni_mt]
        primary_key: [anno, regione]
        min_rows: 10

validation:
  fail_on_error: false
