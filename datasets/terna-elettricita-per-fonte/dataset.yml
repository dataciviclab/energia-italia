root: "../../out"
schema_version: 1

dataset:
  name: "terna_elettricita_per_fonte"
  source_id: "terna_opendata"
  tags: [energia, elettricità, fonti-rinnovabili, clima, mix-energetico]
  category: ambiente
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  time_coverage:
    start_year: 2015
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "terna_electricity_by_source"
      type: "http_file"
      args:
        url: "https://dati.terna.it/api/sitecore/dati/downloadcenter/records?f=xlsx&filterDataset=ElectricityBySource&filterYear={year}&filterMonth=12&orderByColumn=Anno&orderByDir=desc&db=dati&pageSize=5000"
        filename: "terna_electricity_by_source_{year}_12.xlsx"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    header: true
    sheet_name: "Export"
  required_columns: [anno, tipo_produzione, regione, provincia, fonte, produzione_gwh]
  validate:
    min_rows: 100
    not_null: [anno, fonte]

mart:
  tables:
    - name: "mart_mix_regioni"
      sql: "sql/mart_mix_regioni.sql"
  required_tables:
    - "mart_mix_regioni"
  validate:
    table_rules:
      mart_mix_regioni:
        required_columns: [anno, regione, totale_regione_gwh_netta, quota_rinnovabili_pct]
        primary_key: [anno, regione]
        min_rows: 15

validation:
  fail_on_error: true