root: "../../out"
schema_version: 1

dataset:
  name: "terna_load_oraria"
  source_id: "terna_opendata"
  years: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
  time_coverage:
    start_year: 2019
    end_year: 2025
  tags: [energia, elettricità, domanda, carico, oraria]
  category: energia
  description: "Domanda elettrica ogni 15 minuti per zona: total load e market load (Terna), 2019-2025"
  notes: |
    Carico elettrico ogni 15 minuti per zona di mercato, 2019-2025.
    Due serie distinte dal campo iniettato `tipo_carico`:
    - total = TotalLoad (domanda totale)
    - market = MarketLoad (domanda servita dal mercato)
    La differenza quantifica la domanda fuori mercato (autoconsumo).
    Il CSV Terna usa la virgola sia come delimitatore sia come separatore
    decimale: 7 campi per riga, letti come VARCHAR e ricomposti (vedere notes.md).

raw:
  output_policy: overwrite
  sources:
    - name: "terna_total_load_csv"
      type: "http_file"
      args:
        url: "https://dati.terna.it/api/sitecore/dati/downloadcenter/records?f=csv&filterDataset=TotalLoad&filterYear={year}&db=dati&pageSize=1000000"
        filename: "terna_total_load_{year}.csv"
      inject_column:
        tipo_carico: total
      primary: true
    - name: "terna_market_load_csv"
      type: "http_file"
      args:
        url: "https://dati.terna.it/api/sitecore/dati/downloadcenter/records?f=csv&filterDataset=MarketLoad&filterYear={year}&db=dati&pageSize=1000000"
        filename: "terna_market_load_{year}.csv"
      inject_column:
        tipo_carico: market

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    # due sorgenti per anno: leggere tutti i file raw, non solo il piu' recente
    mode: all
    header: false
    skip: 1
    # auto_detect=false + delim esplicito: i file MarketLoad 2019-2020 sono
    # header-only (MarketLoad esiste dal 2021) e il sniffing di DuckDB fallisce
    # su un CSV senza righe dati
    auto_detect: false
    delim: ","
    # CSV "rotto": 7 campi (data, carico int+dec, previsione int+dec, zona, scarto)
    columns:
      col0: "data_ora:VARCHAR"
      col1: "carico_int:VARCHAR"
      col2: "carico_dec:VARCHAR"
      col3: "previsione_int:VARCHAR"
      col4: "previsione_dec:VARCHAR"
      col5: "zona:VARCHAR"
      col6: "scarto:VARCHAR"
  required_columns: [data_ora, anno, tipo_carico, zona, carico_mw, previsione_mw, passo_ore]
  validate:
    not_null: [data_ora, tipo_carico, zona, carico_mw, passo_ore]
    # 2019-2020 hanno solo TotalLoad (~245k righe); 2021+ hanno anche
    # MarketLoad (~562k). La soglia deve coprire l'anno piu' magro.
    min_rows: 200000

mart:
  tables:
    - name: "mart_carico_annuale"
      sql: "sql/mart_carico_annuale.sql"
    - name: "mart_carico_mensile"
      sql: "sql/mart_carico_mensile.sql"
    - name: "mart_profilo_carico"
      sql: "sql/mart_profilo_carico.sql"
    - name: "mart_carico_zona"
      sql: "sql/mart_carico_zona.sql"
    - name: "mart_ore_alta_domanda"
      sql: "sql/mart_ore_alta_domanda.sql"
  required_tables:
    - "mart_carico_annuale"
    - "mart_carico_mensile"
    - "mart_profilo_carico"
    - "mart_carico_zona"
    - "mart_ore_alta_domanda"
  validate:
    table_rules:
      # 2019-2020 hanno la sola serie total (MarketLoad esiste dal 2021):
      # le soglie min_rows valgono per l'anno piu' magro (una sola serie).
      mart_carico_annuale:
        required_columns: [anno, tipo_carico, energia_twh, media_gw, max_gw, errore_previsione_medio_mw]
        primary_key: [anno, tipo_carico]
        min_rows: 1
      mart_carico_mensile:
        required_columns: [anno, mese, tipo_carico, energia_twh, media_gw]
        primary_key: [anno, mese, tipo_carico]
        min_rows: 12
      mart_profilo_carico:
        required_columns: [anno, ora, tipo_carico, media_gw]
        primary_key: [anno, ora, tipo_carico]
        min_rows: 24
      mart_carico_zona:
        required_columns: [anno, zona, tipo_carico, energia_twh, media_gw]
        primary_key: [anno, zona, tipo_carico]
        min_rows: 6
      mart_ore_alta_domanda:
        required_columns: [anno, tipo_carico, soglia_gw, ore]
        primary_key: [anno, tipo_carico, soglia_gw]
        min_rows: 4

validation:
  fail_on_error: true
