root: "../../out"
schema_version: 1

dataset:
  name: "terna_capacita_rinnovabile"
  source_id: "terna_opendata"
  years: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  tags: [energia, elettricità, fonti-rinnovabili]
  category: energia

raw:
  sources:
    - name: "terna_capacity_renewable_sources_xlsx"
      type: "http_file"
      args:
        url: "https://dati.terna.it/api/sitecore/dati/downloadcenter/records?f=xlsx&filterDataset=CapacityRenewableSources&filterYear={year}&filterMonth=12&orderByColumn=Anno&orderByDir=desc&db=dati&pageSize=5000"
        filename: "terna_capacita_rinnovabile_{year}_12.xlsx"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, tipo_capacita, regione, provincia, fonti]
  read:
    source: "auto"
    mode: "latest"
    header: true
    sheet_name: "Export"
  validate:
    not_null: [anno]
    # Il parco rinnovabile era piu' piccolo 2000-2005 (~830 righe):
    # floor 800 copre tutti gli anni e resta sopra troncature tipo pageSize=100.
    min_rows: 800

mart:
  tables:
    - name: "mart_regioni_fonti_nette"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_regioni_fonti_nette"
  validate:
    table_rules:
      mart_regioni_fonti_nette:
        required_columns: [anno, regione, fonti, potenza_totale_mw]
        primary_key: [anno, regione, fonti]
        min_rows: 50

validation:
  fail_on_error: true
