root: "../../out"
schema_version: 1

dataset:
  name: "terna_generation_oraria"
  source_id: "terna_opendata"
  years: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
  time_coverage:
    start_year: 2019
    end_year: 2025
  tags: [energia, elettricità, generazione, oraria, mix-energetico]
  category: energia
  description: "Generazione elettrica oraria per fonte (Terna ActualGeneration), 2019-2025"
  notes: |
    Generazione oraria (2019-2024) e ogni 15 minuti (2025) per fonte:
    Thermal, Hydro, Geothermal, Photovoltaic, Self-consumption, Wind.
    Valori in GW. Fonte: Terna Download Center, dataset ActualGeneration (CSV).
    Il CSV usa la virgola sia come delimitatore sia come separatore decimale:
    vedere notes.md.

raw:
  output_policy: overwrite
  sources:
    - name: "terna_actual_generation_csv"
      type: "http_file"
      args:
        url: "https://dati.terna.it/api/sitecore/dati/downloadcenter/records?f=csv&filterDataset=ActualGeneration&filterYear={year}&db=dati&pageSize=1000000"
        filename: "terna_generation_oraria_{year}.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    header: false
    skip: 1
    # CSV "rotto": 5 campi per riga (data, parte intera, parte decimale,
    # fonte, scarto). Tutto VARCHAR: gli zeri iniziali della parte decimale
    # sono significativi (es. 0.040000 non 0.40000).
    columns:
      col0: "data_ora:VARCHAR"
      col1: "parte_intera:VARCHAR"
      col2: "parte_decimale:VARCHAR"
      col3: "fonte:VARCHAR"
      col4: "scarto:VARCHAR"
  required_columns: [data_ora, anno, fonte, generazione_gw, passo_ore]
  validate:
    not_null: [data_ora, anno, fonte, generazione_gw, passo_ore]
    min_rows: 50000

mart:
  tables:
    - name: "mart_mix_annuale"
      sql: "sql/mart_mix_annuale.sql"
    - name: "mart_mix_mensile"
      sql: "sql/mart_mix_mensile.sql"
    - name: "mart_profilo_orario"
      sql: "sql/mart_profilo_orario.sql"
  required_tables:
    - "mart_mix_annuale"
    - "mart_mix_mensile"
    - "mart_profilo_orario"
  validate:
    table_rules:
      mart_mix_annuale:
        required_columns: [anno, fonte, gwh, quota_pct]
        primary_key: [anno, fonte]
        min_rows: 5
      mart_mix_mensile:
        required_columns: [anno, mese, fonte, gwh]
        primary_key: [anno, mese, fonte]
        min_rows: 60
      mart_profilo_orario:
        required_columns: [anno, ora, fonte, media_gw]
        primary_key: [anno, ora, fonte]
        min_rows: 100

validation:
  fail_on_error: true
