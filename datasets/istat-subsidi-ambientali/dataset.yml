root: "../../out"
schema_version: 1

dataset:
  name: "istat_subsidi_ambientali"
  source_id: "istat_sdmx"
  tags: [ambiente, sussidi, istat, economia-verde, transferimenti]
  category: ambiente
  years: [2026]
  time_coverage:
    start_year: 1995
    end_year: 2023

raw:
  output_policy: overwrite
  sources:
    - name: "istat_72_1028"
      type: "http_file"
      args:
        url: "https://esploradati.istat.it/SDMXWS/rest/data/72_1028/ALL/?format=csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  required_columns: [freq, ref_area, data_type, nace_r2, cep_class, year, obs_value, unit]
  validate:
    min_rows: 100
    not_null: [time_period, cep_class]

mart:
  tables:
    - name: "mart_sussidi_per_cea"
      sql: "sql/mart_sussidi_per_cea.sql"
    - name: "mart_trend_sussidi"
      sql: "sql/mart_trend_sussidi.sql"
  required_tables:
    - "mart_sussidi_per_cea"
    - "mart_trend_sussidi"
  validate:
    table_rules:
      mart_sussidi_per_cea:
        required_columns: [year, dominio, sussidi_mln_eur]
        primary_key: [year, dominio]
        min_rows: 100
      mart_trend_sussidi:
        required_columns: [dominio, anno_primo, primo_val, anno_ultimo, ultimo_val, delta_pct]
        primary_key: [dominio]
        min_rows: 5

validation:
  fail_on_error: false
