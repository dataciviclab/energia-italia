root: "../../out"
schema_version: 1

dataset:
  name: "irena_lcoe"
  source_id: "irena"
  tags: [energia, costi, lcoe, rinnovabili, confronti-internazionali]
  category: energia
  years: [2024]
  time_coverage:
    start_year: 2010
    end_year: 2024
  notes: |
    LCOE globale pesato per tecnologia (IRENA, Renewable Power Generation Costs
    in 2024). Un file statico per release: `years` e' l'anno della release,
    i dati coprono 2010-2024. Fonte: foglio "Fig 1.2 " del datafile IRENA.

raw:
  output_policy: overwrite
  sources:
    - name: "irena_costs_datafile"
      type: "http_file"
      args:
        url: "https://www.irena.org/-/media/Files/IRENA/Agency/Publication/2025/Jul/IRENA-Datafile-RenPwrGenCosts-in-2024.xlsx"
        filename: "IRENA_RenPwrGenCosts_2024.xlsx"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    header: false
    skip: 5
    # il foglio si chiama "Fig 1.2 " (spazio finale, strippato dal reader):
    # selezione per indice posizionale
    sheet_name: 13
  required_columns: [tecnologia, anno, lcoe_usd_kwh]
  validate:
    min_rows: 90
    not_null: [tecnologia, anno]
    transition:
      # l'unpivot cambia numero e nomi delle colonne per costruzione
      warn_removed_columns: false

mart:
  tables:
    - name: "mart_lcoe_tecnologia"
      sql: "sql/mart_lcoe_tecnologia.sql"
  required_tables:
    - "mart_lcoe_tecnologia"
  validate:
    table_rules:
      mart_lcoe_tecnologia:
        required_columns: [tecnologia, anno, lcoe_usd_kwh, variazione_vs_2010_pct]
        primary_key: [tecnologia, anno]
        min_rows: 90

validation:
  fail_on_error: true
