root: "../../out"
schema_version: 1

dataset:
  name: "terna_elettricita_per_settore"
  source_id: "terna_opendata"
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  tags: [energia, elettricità, consumi, settore]
  category: energia

raw:
  output_policy: overwrite
  sources:
    - name: "terna_electrical_energy_xlsx"
      type: "http_file"
      args:
        url: "https://dati.terna.it/api/sitecore/dati/downloadcenter/records?f=xlsx&filterDataset=ElectricalEnergy&filterYear={year}&filterMonth=12&orderByColumn=Anno&orderByDir=desc&db=dati&pageSize=100"
        filename: "terna_electrical_energy_{year}_12.xlsx"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    header: true
    sheet_name: "Export"
  required_columns: [anno, regione, provincia, settore, consumo_gwh]
  validate:
    min_rows: 100
    not_null: [anno, settore]

mart:
  tables:
    - name: "mart_consumi_settore_provincia"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_consumi_settore_provincia"
  validate:
    table_rules:
      mart_consumi_settore_provincia:
        required_columns: [anno, regione, settore, consumo_gwh]
        primary_key: [anno, regione, settore]
        min_rows: 50

validation:
  fail_on_error: false
